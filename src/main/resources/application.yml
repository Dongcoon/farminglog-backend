spring:
  application:
    name: farmlog-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farming}?useUnicode=true&characterEncoding=utf8&connectTimeout=5000&socketTimeout=15000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:10}MB
      max-request-size: ${FILE_MAX_SIZE_MB:10}MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 200
    default-statement-timeout: 15

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

farmlog:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_farmlog_local_secret_key_please_override_in_env}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  password-reset:
    # SMTP 미구성(4.4) — 실제 발송 대신 이 base-url을 포함한 링크를 콘솔(INFO 로그)에 출력한다.
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/password-reset}
  invitation:
    # local/dev/test 전용 로그 전달 URL. prod는 실제 SMTP/outbox InvitationDelivery 구현이 필수다.
    web-base-url: ${INVITATION_WEB_BASE_URL:http://localhost:5173}
  file:
    storage-type: LOCAL
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
    allowed-extensions: jpg,jpeg,png,heic,webp,pdf
  export:
    root-dir: ${EXPORT_ROOT_DIR:./exports}
    retention-days: ${EXPORT_RETENTION_DAYS:7}
    xlsx-max-rows: ${EXPORT_XLSX_MAX_ROWS:200000}
    pdf-max-rows: ${EXPORT_PDF_MAX_ROWS:5000}
    lease-minutes: ${EXPORT_LEASE_MINUTES:10}
    max-attempts: ${EXPORT_MAX_ATTEMPTS:3}
    poll-delay-ms: ${EXPORT_POLL_DELAY_MS:1000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

logging:
  level:
    root: INFO
    com.farmlog: DEBUG
